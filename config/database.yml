default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  host: ep-damp-bar-ax7kbwsj-pooler.c-4.us-east-2.aws.neon.tech
  port: 5432
  database: neondb
  username: <%= ENV["NEON_DB_USERNAME"] %>
  password: <%= ENV["NEON_DB_PASSWORD"] %>
  sslmode: require
  channel_binding: require

test:
  <<: *default
  database: book_my_show_test
